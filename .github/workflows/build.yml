name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lavaweight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags visual
      - name: Render actual Flutter pages
        env:
          LAVA_REVIEW_FONT: /tmp/lava-review.ttf
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o "$LAVA_REVIEW_FONT"
          flutter test --tags visual
      - name: Upload rendered pages
        uses: actions/upload-artifact@v7
        with:
          name: LavaWeight-screenshots-${{ github.sha }}
          path: build/visual-review/*.png
          if-no-files-found: error
      - name: Build development preview APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload development preview APK
        uses: actions/upload-artifact@v7
        with:
          name: LavaWeight-preview-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
