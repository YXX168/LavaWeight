name: Build & Validate LavaWeight Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lavaweight-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart code
        run: |
          dart format lib test
          if [ -n "$(git status --porcelain lib test)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: auto-format Dart code with dart format [skip ci]"
            git push origin main
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LavaWeight-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LavaWeight-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

