name: lava_weight
description: A local-first weight journal with luminous lava-lamp glass design.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home_lava.png
    - assets/images/trends_lava.png
    - assets/images/record_lava.png
